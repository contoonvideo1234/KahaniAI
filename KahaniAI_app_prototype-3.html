<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KahaniAI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#101018;color:#fff}
.app{max-width:430px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#171327,#0d0d14);padding-bottom:80px}
header{padding:24px 20px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:800}.logo span{color:#ff7b54}.pro{background:#ff7b54;border:0;color:#fff;border-radius:20px;padding:8px 13px;font-weight:700}
.hero{margin:10px 16px;padding:22px;border-radius:22px;background:linear-gradient(135deg,#7138ff,#ff5c7a);box-shadow:0 10px 30px #0005}
.hero h1{margin:0 0 8px;font-size:25px}.hero p{margin:0 0 18px;color:#f5eaff}
button{font:inherit;cursor:pointer}.primary{border:0;border-radius:14px;padding:12px 18px;background:#fff;color:#321d63;font-weight:800}
.section{padding:8px 16px}.section h2{font-size:18px;margin:18px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#201d2b;border:1px solid #ffffff12;border-radius:18px;padding:16px;text-align:left;color:#fff}.emoji{font-size:28px}.card b{display:block;margin-top:8px}
textarea{width:100%;height:150px;background:#17151f;color:#fff;border:1px solid #ffffff1c;border-radius:16px;padding:14px;resize:none;outline:none}
#creator{display:none;padding:16px}.back{background:none;border:0;color:#bbb;padding:0 0 15px}.generate{width:100%;margin-top:12px;background:linear-gradient(90deg,#ff7b54,#ff4f91);color:#fff;border:0;border-radius:15px;padding:14px;font-weight:800}
.output{display:none;margin-top:16px;background:#201d2b;border-radius:18px;padding:16px}.scene{padding:12px;border-bottom:1px solid #ffffff10}.scene:last-child{border:0}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:#17151f;border-top:1px solid #ffffff12;display:flex;justify-content:space-around;padding:10px 4px}
nav button{background:none;border:0;color:#aaa;font-size:12px}nav button.active{color:#ff7b54}
.small{color:#aaa;font-size:13px}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">✨ Kahani<span>AI</span></div><button class="pro">PRO</button></header>

<main id="home">
<section class="hero">
<h1>कहानी लिखो, वीडियो बनाओ 🎬</h1>
<p>अपनी कहानी को Scenes, Dialogues और Voice-ready script में बदलें।</p>
<button class="primary" onclick="openCreator()">+ नई कहानी बनाएं</button>
</section>
<section class="section">
<h2>लोकप्रिय Categories</h2>
<div class="grid">
<button class="card" onclick="pick('एक गरीब नानी और उसके नाती की भावुक कहानी')"><span class="emoji">👵</span><b>नानी–नाती</b><span class="small">Emotional</span></button>
<button class="card" onclick="pick('एक प्यारी और मजेदार Love Story')"><span class="emoji">❤️</span><b>Love Story</b><span class="small">Romance</span></button>
<button class="card" onclick="pick('एक हाथी और जादुई पत्थर की रोमांचक कहानी')"><span class="emoji">🐘</span><b>Magic</b><span class="small">Adventure</span></button>
<button class="card" onclick="pick('बच्चों के लिए एक मजेदार Moral Story')"><span class="emoji">🌟</span><b>Kids</b><span class="small">Moral</span></button>
</div>
</section>
</main>

<section id="creator">
<button class="back" onclick="closeCreator()">← वापस</button>
<h2>✨ नई कहानी</h2>
<p class="small">अपनी कहानी या सिर्फ एक idea लिखें।</p>
<textarea id="story" placeholder="जैसे: एक गरीब नानी अपने नाती के लिए बहुत मेहनत करती थी..."></textarea>
<button class="generate" onclick="generate()">🎬 Story को Video Script में बदलें</button>
<div class="output" id="output"></div>
</section>

<nav>
<button class="active" onclick="showHome()">⌂<br>Home</button>
<button onclick="openCreator()">＋<br>Create</button>
<button>▣<br>Projects</button>
<button>👤<br>Profile</button>
</nav>
</div>

<script>
function openCreator(){home.style.display='none';creator.style.display='block'}
function closeCreator(){creator.style.display='none';home.style.display='block'}
function showHome(){closeCreator();window.scrollTo(0,0)}
function pick(t){openCreator();story.value=t}
function generate(){
 let t=story.value.trim()||'एक प्यारी कहानी';
 output.style.display='block';
 output.innerHTML=`<h3>🎬 आपकी कहानी तैयार है</h3>
 <div class="scene"><b>Scene 1 — शुरुआत</b><br>${t}<br><span class="small">Visual: cinematic 3D animation, vertical 9:16</span></div>
 <div class="scene"><b>Scene 2 — भावनात्मक पल</b><br>मुख्य किरदार अपने सपने और मुश्किलों के बारे में बात करते हैं।<br><span class="small">Dialogue + AI Voice ready</span></div>
 <div class="scene"><b>Scene 3 — Twist</b><br>कहानी में एक unexpected घटना होती है और कहानी आगे बढ़ती है।</div>
 <div class="scene"><b>Scene 4 — Ending</b><br>कहानी एक भावुक और यादगार संदेश के साथ खत्म होती है।</div>
 <button class="generate" onclick="alert('Prototype: यहाँ आगे Image/Voice/Video generation API जोड़ी जाएगी।')">🖼️ Images & Voice Generate करें</button>`;
}
</script>
</body>
</html>
